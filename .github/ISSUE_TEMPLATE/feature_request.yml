name: Feature Request
description: Suggest an improvement to Sarge
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the feature you'd like to see in Sarge.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Sarge does this affect?
      options:
        - Assessment engine
        - Hardening scripts
        - Drift detection
        - Report output / formatting
        - Platform support
        - OpenClaw integration / SKILL.md
        - Documentation
        - Testing
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What problem does this solve, or what use case does it enable?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you considered and why they don't work as well.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, links, related issues, etc.
    validations:
      required: false
